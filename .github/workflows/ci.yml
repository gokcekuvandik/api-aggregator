name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # MinVer reads the version from git tags
          persist-credentials: false

      - name: Set up .NET (SDK from global.json)
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json

      - name: Restore
        run: |
          dotnet restore
          dotnet tool restore

      - name: Build (warnings are errors)
        run: dotnet build --no-restore -c Release -warnaserror

      # The build already enforces code style and analyzers (EnforceCodeStyleInBuild), so only whitespace is left to check.
      - name: Verify whitespace formatting
        run: dotnet format whitespace Aggregator.slnx --verify-no-changes

      - name: Test with coverage
        run: dotnet test --no-build -c Release --results-directory TestResults --coverage --coverage-output-format cobertura --coverage-settings coverage.settings.xml

      - name: Coverage report and 80% line gate
        run: bash build/coverage.sh TestResults

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: |
            TestResults/**/*.cobertura.xml
            TestResults/coverage-report/
